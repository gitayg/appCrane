AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  AppCrane platform secret and an IAM managed policy for the instance role.
  Attach the policy to the role, require IMDSv2 at hop limit 1 so app containers
  cannot use the role, then run crane secrets migrate --secret-id with the
  PlatformSecretName output.

Parameters:
  PlatformSecretName:
    Type: String
    Default: appcrane/platform
    AllowedPattern: '^[A-Za-z0-9/_+=.@-]+$'
    Description: Name of the platform secret. Must not sit under AppSecretPrefix.
  AppSecretPrefix:
    Type: String
    Default: appcrane/apps
    AllowedPattern: '^[A-Za-z0-9_+=.@-]+(/[A-Za-z0-9_+=.@-]+)*$'
    Description: Same value as APPCRANE_SECRETS_APP_PREFIX. App secrets live at prefix/namespace/env/NAME, where namespace is the random value on the app's row.

Resources:
  PlatformSecret:
    Type: AWS::SecretsManager::Secret
    # This secret ends up holding the key that decrypts every stored value.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Ref PlatformSecretName
      Description: AppCrane platform keys as a JSON object. Created with a generated placeholder; crane secrets migrate fills it.
      # No value in this template. Do not change this block on a live stack: a
      # change makes CloudFormation generate a new value over the real keys.
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: PLACEHOLDER
        PasswordLength: 32
        ExcludePunctuation: true

  InstancePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: AppCrane instance role - the platform secret and the app secret prefix, nothing else.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PlatformSecret
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
              - secretsmanager:PutSecretValue
              - secretsmanager:UpdateSecretVersionStage
            Resource: !Ref PlatformSecret
          # No DeleteSecret: the secrets of a deleted app are the operator's to delete.
          - Sid: AppSecrets
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
              - secretsmanager:PutSecretValue
              - secretsmanager:UpdateSecretVersionStage
              - secretsmanager:CreateSecret
            Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AppSecretPrefix}/*'

Outputs:
  PlatformSecretArn:
    Description: Use as --secret-id for crane secrets migrate.
    Value: !Ref PlatformSecret
  PlatformSecretName:
    Description: Name of the platform secret.
    Value: !Ref PlatformSecretName
  InstancePolicyArn:
    Description: Attach to the instance role.
    Value: !Ref InstancePolicy
