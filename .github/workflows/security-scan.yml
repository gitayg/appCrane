name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Full scan feeds the Security tab; it must not fail the job or the
      # SARIF never gets uploaded. The blocking decision happens below.
      - name: Run Semgrep (SARIF for Security tab)
        run: semgrep ci --config=auto --sarif --output=semgrep.sarif
        continue-on-error: true
      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      # v2.27.0: this used to be advisory only — every finding was
      # continue-on-error, so nothing ever blocked a merge. Shell injection and
      # missing tenant authorization are the two bug classes that produced ~55
      # critical advisories across comparable self-hosted PaaS products in 2026,
      # so ERROR-severity findings now fail the build. Warnings stay advisory
      # and remain visible in the Security tab.
      # Gates on the SARIF the step above already produced, rather than running
      # a second scan. `semgrep ci` has no --severity flag (that's `semgrep
      # scan`), so the previous form died on argument parsing every run — a
      # gate that could never gate, which is worse than no gate because the
      # red X looks like a finding. Reading the SARIF also halves the job time
      # and guarantees the gate judges exactly what got uploaded to the
      # Security tab.
      - name: Gate on ERROR-severity findings
        run: |
          python3 - <<'PY'
          import json, sys, os

          if not os.path.exists('semgrep.sarif'):
              print('::error::semgrep.sarif missing — the scan did not complete, so nothing was verified')
              sys.exit(1)

          with open('semgrep.sarif') as f:
              sarif = json.load(f)

          errors = [r for run in sarif.get('runs', [])
                      for r in run.get('results', [])
                      if r.get('level') == 'error']

          for r in errors:
              loc = (r.get('locations') or [{}])[0].get('physicalLocation', {})
              uri = loc.get('artifactLocation', {}).get('uri', '?')
              line = loc.get('region', {}).get('startLine', 1)
              msg = r.get('message', {}).get('text', '').replace('\n', ' ')[:300]
              print(f'::error file={uri},line={line}::{r.get("ruleId","?")}: {msg}')

          total = sum(len(run.get('results', [])) for run in sarif.get('runs', []))
          print(f'{len(errors)} ERROR-severity finding(s) out of {total} total.')
          print('Warnings stay advisory and are visible in the Security tab.')
          sys.exit(1 if errors else 0)
          PY

  osv-scanner:
    name: OSV-Scanner (Dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --lockfile=package-lock.json
            --format=sarif
            --output=osv.sarif
            --recursive
        # Non-failing on purpose, same as the semgrep scan above: the SARIF must
        # reach the Security tab even when there are findings. The blocking
        # decision is the separate gate below.
        continue-on-error: true
      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3
        with:
          sarif_file: osv.sarif
          category: osv-scanner
      # v2.49.1: dependency findings now BLOCK, mirroring the semgrep gate.
      #
      # Until now this job had a scan that could not fail and no gate after it,
      # so it reported success on every push while the tree carried seven
      # advisories — among them a high-severity adm-zip DoS whose fix had been
      # published six weeks earlier and which was reachable from an ordinary
      # app-user upload, extracted in the AppCrane server process on a host with
      # no swap. Results went to the Security tab, which nobody opened. A check
      # that cannot fail is a dashboard, not a check.
      #
      # Turned on at the moment `npm audit` reported zero, which is the only
      # cheap time to do it. When a finding has no fix available, do NOT switch
      # the gate off — add that advisory ID to IGNORED below with a reason and a
      # date, so the exception is one reviewable line instead of a silent hole.
      - name: Gate on dependency findings
        run: |
          python3 - <<'PY'
          import json, sys, os

          # Advisory IDs accepted for now. Each needs a reason and a date.
          #   'GHSA-xxxx-xxxx-xxxx': 'no fix published as of 2026-08-19; <impact>'
          IGNORED = {}

          if not os.path.exists('osv.sarif'):
              print('::error::osv.sarif missing — the scan did not complete, so no dependency was verified')
              sys.exit(1)

          with open('osv.sarif') as f:
              sarif = json.load(f)

          findings, ignored = [], []
          for run in sarif.get('runs', []):
              for r in run.get('results', []):
                  rid = r.get('ruleId', '?')
                  (ignored if rid in IGNORED else findings).append((rid, r))

          for rid, r in findings:
              msg = r.get('message', {}).get('text', '').replace('\n', ' ')[:300]
              print(f'::error::{rid}: {msg}')
          for rid, _ in ignored:
              print(f'::notice::{rid} ignored — {IGNORED[rid]}')

          print(f'{len(findings)} blocking dependency finding(s), {len(ignored)} ignored.')
          sys.exit(1 if findings else 0)
          PY
